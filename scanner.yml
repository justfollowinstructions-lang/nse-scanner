name: NSE Long-Term Investment Scanner  (v2 — fully audited)

# ─────────────────────────────────────────────────────────────────────
# SCHEDULE OVERVIEW  (all times IST = UTC + 5:30)
#
#  ┌─ Bi-weekly full scan ─── 1st and 15th of each month at 8:00 AM
#  ├─ Weekly fundamentals ─── Every Sunday at 7:00 AM  (keeps data fresh)
#  └─ Watchlist check ──────── Every Saturday at 9:00 AM
#
# UTC conversions:
#   8:00 AM IST  = 2:30 AM UTC
#   7:00 AM IST  = 1:30 AM UTC
#   9:00 AM IST  = 3:30 AM UTC
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Bi-weekly full scan (1st and 15th of each month, 8 AM IST)
    - cron: "30 2 1  * *"
    - cron: "30 2 15 * *"

    # Weekly fundamentals refresh (Sunday 7 AM IST)
    - cron: "30 1 * * 0"

    # Weekly watchlist check (Saturday 9 AM IST)
    - cron: "30 3 * * 6"

  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        type: choice
        options:
          - full-scan           # Full scan of entire NSE universe
          - watchlist           # Rescan previously identified stocks
          - update-ohlcv        # Update price data only
          - update-fundamentals # Force-refresh all fundamentals (screener + yf)
          - update-sectors      # Update index/sector data
          - bootstrap           # First-time full download (~90-120 min)
          - test                # Test run (large + mid + small cap mix)
          - stats               # Print DB statistics
      min_score:
        description: "Minimum score to include (0-100)"
        required: false
        default: "35"
      max_per_sector:
        description: "Max stocks per sector in output (0 = unlimited)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  invest_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Python ───────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── pip cache ─────────────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # ── Install ───────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── BUG-15 FIX: Monthly cache key (was weekly — rolled over on Mondays) ──
      # Old key: invest-cache-${{ runner.os }}-week${{ steps.week.outputs.week }}
      # Problem: if 1st or 15th fell on Monday, cache was just invalidated
      #          → cold-start on 2200 stocks → rate-limit timeout.
      # Fix: monthly key. Cache survives the full month; rolls over once a month.
      - name: Get month key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> $GITHUB_OUTPUT

      - name: Restore invest_cache.db
        uses: actions/cache@v4
        with:
          path: invest_cache.db
          key: invest-cache-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: |
            invest-cache-${{ runner.os }}-

      # ── Determine mode ────────────────────────────────────────────────────────
      - name: Determine mode
        id: mode
        run: |
          SCHED="${{ github.event.schedule }}"
          INPUT="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT" ]; then
            echo "MODE=$INPUT" >> $GITHUB_OUTPUT
          elif [ "$SCHED" = "30 1 * * 0" ]; then
            echo "MODE=update-fundamentals" >> $GITHUB_OUTPUT
          elif [ "$SCHED" = "30 3 * * 6" ]; then
            echo "MODE=watchlist" >> $GITHUB_OUTPUT
          else
            echo "MODE=full-scan" >> $GITHUB_OUTPUT
          fi

      - name: Set scan parameters
        id: params
        run: |
          echo "MIN_SCORE=${{ github.event.inputs.min_score || '35' }}" >> $GITHUB_OUTPUT
          echo "MAX_SECTOR=${{ github.event.inputs.max_per_sector || '0' }}" >> $GITHUB_OUTPUT

      # ── BOOTSTRAP ─────────────────────────────────────────────────────────────
      - name: Bootstrap (first-time full download)
        if: steps.mode.outputs.MODE == 'bootstrap'
        timeout-minutes: 110
        run: |
          echo "=== Bootstrap: all NSE stocks, 3 timeframes + fundamentals ==="
          python data_updater.py --bootstrap
          python data_updater.py --stats

      # ── FULL SCAN (bi-weekly: 1st & 15th) ────────────────────────────────────
      # Step 1: OHLCV incremental update (fast — only new bars since last run)
      # Step 2: Sector/index data
      # Step 3: Full investment scan
      - name: Full scan
        if: steps.mode.outputs.MODE == 'full-scan'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "=== Step 1/3: Incremental OHLCV update ==="
          python data_updater.py --update
          echo "=== Step 2/3: Sector indices ==="
          python data_updater.py --sectors
          echo "=== Step 3/3: Investment scan ==="
          python scanner.py --scan \
            --min-score ${{ steps.params.outputs.MIN_SCORE }} \
            --max-per-sector ${{ steps.params.outputs.MAX_SECTOR }}

      # ── WATCHLIST CHECK (Saturday) ────────────────────────────────────────────
      - name: Watchlist rescan
        if: steps.mode.outputs.MODE == 'watchlist'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "=== Updating OHLCV for latest prices ==="
          python data_updater.py --update
          echo "=== Watchlist rescan ==="
          python scanner.py --watchlist \
            --min-score ${{ steps.params.outputs.MIN_SCORE }} \
            --max-per-sector ${{ steps.params.outputs.MAX_SECTOR }}

      # ── FUNDAMENTALS REFRESH (Sunday) ─────────────────────────────────────────
      # Force-clears stale fund_cache then re-fetches yfinance + screener.in
      - name: Update fundamentals
        if: steps.mode.outputs.MODE == 'update-fundamentals'
        run: |
          echo "=== Force-refreshing all fundamentals ==="
          python data_updater.py --fundamentals

      # ── STANDALONE MODES (manual trigger only) ────────────────────────────────
      - name: Update OHLCV only
        if: steps.mode.outputs.MODE == 'update-ohlcv'
        run: python data_updater.py --update

      - name: Update sectors only
        if: steps.mode.outputs.MODE == 'update-sectors'
        run: python data_updater.py --sectors

      - name: Stats
        if: steps.mode.outputs.MODE == 'stats'
        run: python data_updater.py --stats

      - name: Test run (large + mid + small cap mix)
        if: steps.mode.outputs.MODE == 'test'
        run: python scanner.py --test

      # ── SAVE CACHE  (always — preserve DB for next run) ───────────────────────
      - name: Save invest_cache.db
        if: always()
        uses: actions/cache/save@v4
        with:
          path: invest_cache.db
          # Include run_number in save key so each run creates a new cache entry.
          # restore-keys fallback above still finds the latest monthly entry.
          key: invest-cache-${{ runner.os }}-${{ steps.month.outputs.month }}-${{ github.run_number }}

      # ── COMMIT OUTPUTS ────────────────────────────────────────────────────────
      - name: Commit scan CSVs to repo
        if: |
          steps.mode.outputs.MODE == 'full-scan' ||
          steps.mode.outputs.MODE == 'watchlist'  ||
          steps.mode.outputs.MODE == 'test'
        run: |
          git config user.name  "NSE Investment Scanner Bot"
          git config user.email "invest-scanner@noreply.github.com"
          git add output/ || true
          git diff --staged --quiet || \
            git commit -m "scan: $(date -u '+%Y-%m-%d') — investment results"
          git push || true

      # ── UPLOAD ARTIFACTS ──────────────────────────────────────────────────────
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invest-${{ steps.mode.outputs.MODE }}-${{ github.run_number }}
          path: |
            output/
            logs/
          retention-days: 60
